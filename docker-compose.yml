version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: campus_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: campus_web
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "5000:5000"

volumes:
  db_data: