version: "3.9"

services:
  web:
    build: .
    container_name: campus_web
    command: >
      sh -c "
      echo 'Waiting for database...' &&
      sleep 15 &&
      flask db upgrade &&
      python -m scripts.init_demo_data &&
      gunicorn -b 0.0.0.0:5000 --timeout 120 run:app
      "
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    container_name: campus_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: