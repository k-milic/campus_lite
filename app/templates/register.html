{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body">

                <h4 class="card-title text-center mb-4">
                    Registrierung
                </h4>

                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Benutzername</label>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">E-Mail</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Passwort</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-success">
                            Registrieren
                        </button>
                    </div>
                </form>

                <hr>

                <div class="text-center">
                    <small>
                        Bereits registriert?
                        <a href="{{ url_for('auth.login') }}">
                            Zum Login
                        </a>
                    </small>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
