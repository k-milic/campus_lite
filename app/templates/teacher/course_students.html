{% extends "base.html" %}

{% block content %}
<h2>Studenten – {{ course.name }}</h2>

<form method="post">
    <table class="table">
        <thead class="table-dark">
            <tr>
                <th></th>
                <th>Username</th>
                <th>E-Mail</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>
                    <input type="checkbox"
                           name="students"
                           value="{{ student.id }}"
                           {% if student.id in enrolled_ids %}checked{% endif %}>
                </td>
                <td>{{ student.username }}</td>
                <td>{{ student.email }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <button class="btn btn-success">
        Speichern
    </button>

    <a href="{{ url_for('teacher.course_list') }}"
       class="btn btn-secondary">
        Zurück
    </a>
</form>
{% endblock %}
