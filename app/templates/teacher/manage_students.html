{% extends "base.html" %}

{% block content %}
<h2>Studenten – {{ course.name }}</h2>

<form method="post">
<table border="1" cellpadding="5">
    <tr>
        <th>Student</th>
        <th>Eingeschrieben</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.username }}</td>
        <td>
            <input type="checkbox"
                   name="students"
                   value="{{ student.id }}"
                   {% if student.id in enrolled_ids %}checked{% endif %}>
        </td>
    </tr>
    {% endfor %}
</table>

<br>
<button type="submit">Speichern</button>
</form>

<br>
<a href="{{ url_for('teacher.course_list') }}">Zurueck</a>
{% endblock %}
